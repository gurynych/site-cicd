    <h1>Как работает автодеплой</h1>
    <ol>
      <li>Изменения отправляются в ветку main.</li>
      <li>GitHub Actions запускает workflow.</li>
      <li>Скрипт build.py собирает страницы в папку _site.</li>
      <li>Страницы проверяются утилитой html-validate.</li>
      <li>Папка _site публикуется на GitHub Pages.</li>
    </ol>

    <h1>О проекте</h1>
    <p>Сайт состоит из нескольких страниц с общей шапкой и общим подвалом.</p>
    <p>Шапка с меню и подвал хранятся в одном файле шаблона templates/base.html, а в папке pages лежит только содержимое каждой страницы.</p>
    <p>Готовые страницы собирает скрипт build.py во время работы workflow.</p>
